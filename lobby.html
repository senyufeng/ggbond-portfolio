<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战术大厅 — GGBond Tactical</title>
  <meta name="description" content="GGBond 战术大厅：CS2 风格的主菜单，全屏 3D 沙漠糖果工厂场景与极简 HUD。">
  <meta name="author" content="GGBond">
  <meta name="theme-color" content="#0a0b0c">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://ggbond-portfolio.uk2023usa2022.workers.dev/lobby.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tactical.css">
  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three.module.min.js",
      "three/addons/": "./assets/vendor/"
    }
  }
  </script>
</head>
<body class="tac-page" data-screen="lobby">
  <a class="skip-link" href="#tacMain">跳到主要内容</a>
  <canvas id="tac-canvas" aria-hidden="true"></canvas>
  <div class="tac-vignette" aria-hidden="true"></div>
  <div class="tac-scanlines" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="tac-boot" id="tacBoot" aria-hidden="true">
    <span class="tac-boot-line"></span>
    <span>INITIALIZING TACTICAL FEED</span>
  </div>

  <div class="tac-ui">
    <header class="tac-topbar">
      <a class="tac-brand" href="index.html" aria-label="返回 GGBond 主站">
        <span class="tac-brand-mark">GGB<span>.</span></span>
        <span class="tac-brand-sub">TACTICAL / 08</span>
      </a>

      <nav class="tac-tabs" aria-label="展示页导航">
        <a href="lobby.html" class="is-active" aria-current="page">大厅</a>
        <a href="loading.html">加载</a>
        <a href="briefing.html">简报</a>
        <a href="index.html">主站</a>
      </nav>

      <div class="tac-user">
        <span class="tac-online"><i aria-hidden="true"></i>ONLINE</span>
        <span class="tac-user-name">GGBond</span>
        <span class="tac-user-level">LVL 08</span>
        <span class="tac-user-candy">🍭 1,024</span>
      </div>
    </header>

    <main id="tacMain" class="cs-home">
      <section class="cs-play" aria-label="主菜单展示">
        <p class="cs-kicker">CONCEPT UI / CS2-STYLE MAIN MENU</p>
        <div class="cs-play-btn cs-play-btn--static" role="img" aria-label="PLAY 主菜单按钮展示">
          <span class="cs-play-icon" aria-hidden="true">▶</span>
          <span class="cs-play-word">PLAY</span>
          <span class="cs-play-sub">开始游戏 / 竞技 5V5 · 展示界面</span>
        </div>

        <div class="cs-mode-tabs" role="group" aria-label="模式展示">
          <span class="is-active">竞技</span>
          <span>搭档</span>
          <span>休闲</span>
        </div>

        <p class="cs-map-line">地图池 · 糖果工厂 / SUGAR FACTORY</p>
        <p class="cs-small-link">静态展示页面 / DISPLAY ONLY</p>
      </section>

    </main>

    <footer class="cs-bottom">
      <div class="cs-player">
        <span class="cs-avatar" aria-hidden="true">G</span>
        <div class="cs-player-copy">
          <strong>GGBond</strong>
          <small>LVL 08 · 超级英雄</small>
        </div>
        <span class="cs-rank" role="img" aria-label="等级 8">08</span>
      </div>

      <div class="cs-status">
        <span class="cs-good">SCENE / LIVE</span>
        <span>3D BACKGROUND</span>
        <span>STATIC UI</span>
      </div>
    </footer>
  </div>

  <script type="module" src="tactical.js"></script>
  <script>window.setTimeout(function(){var b=document.getElementById('tacBoot');if(b)b.classList.add('is-hidden');},9000);</script>
</body>
</html>
